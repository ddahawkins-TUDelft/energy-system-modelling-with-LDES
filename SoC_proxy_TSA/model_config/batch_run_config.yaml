no_proxy:  
  Without SoC Forecast:
    dispatch_mode: 'cluster'
    calliope_params:
    soc_proxy_params:
    tsa_params:
      k_periods: 37
      soc_proxy: 
          use_soc_proxy: False
          proxy_inputs_to_consider: ['surplus_LDES'] 
          proxy_window: None

proxy_baseline:
  With SoC Forecast:
    dispatch_mode: 'cluster'
    calliope_params:
    soc_proxy_params:
    tsa_params:
      k_periods: 37
      soc_proxy: 
          use_soc_proxy: True
          proxy_inputs_to_consider: ['surplus_LDES'] 
          proxy_window: None
      matrix_weights: 
            renewables: 1
            demand: 1
            proxy: 1
      soc_features:
        soc_discharge_MWh: 10
      extremes_spec: {}
