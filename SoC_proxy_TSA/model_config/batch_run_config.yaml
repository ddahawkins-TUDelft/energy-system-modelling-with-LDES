optimisation_baseline:
  Optimisation without SoC Forecast:
    dispatch_mode: 'optimisation'
    calliope_params:
    soc_proxy_params:
    tsa_params:
      k_periods: 37
      rr_mode: soft
      resample_to_daily_resolution: True
      distance_matrix_metric: 'euclidean'
      soc_proxy: 
          use_soc_proxy: False
          proxy_inputs_to_consider: [''] 
          proxy_window: None
          optimisation_proxy_mode: 'exogenous'
      matrix_weights: 
            renewables: 1
            demand: 1
            proxy: 1
      soc_features:
      extremes_spec: {}
      soft_prune: False
      post_cluster_optimisation_params:
        objective:
            - polarity: minimise
              target: soc_proxy_ldes
              weight: 1.0
              mode: match
  Optimisation with SoC Forecast:
      dispatch_mode: 'optimisation'
      calliope_params:
      soc_proxy_params:
      tsa_params:
        k_periods: 37
        rr_mode: soft
        resample_to_daily_resolution: True
        distance_matrix_metric: 'euclidean'
        soc_proxy: 
            use_soc_proxy: True
            proxy_inputs_to_consider: ['surplus_LDES'] 
            proxy_window: None
            optimisation_proxy_mode: 'exogenous'
        matrix_weights: 
              renewables: 1
              demand: 1
              proxy: 1
        soc_features:
        extremes_spec: {}
        soft_prune: False
        post_cluster_optimisation_params:
          objective:
              - polarity: minimise
                target: soc_proxy_ldes
                weight: 1.0
                mode: match

