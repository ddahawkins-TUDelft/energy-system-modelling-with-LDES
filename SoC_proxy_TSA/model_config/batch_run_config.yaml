cluster_with_optimisation:
  endogenous_optimisation_correction:
      dispatch_mode: 'cluster_with_optimisation'
      calliope_params:
      soc_proxy_params:
      tsa_params:
        k_periods: 146
        k_periods_optimisation: 37
        resample_to_daily_resolution: True
        distance_matrix_metric: 'euclidean'
        soc_proxy: 
            use_soc_proxy: True
            proxy_inputs_to_consider: ['surplus_LDES'] 
            proxy_window: None
            optimisation_proxy_mode: 'endogenous'
            lambda_soc: .5
        # apply_endogenous_biases: True
        timelimit: 1200
        matrix_weights: 
              renewables: 1
              demand: 1
              proxy: 10
        soc_features:
        extremes_spec: {}
        soft_prune: False
        post_cluster_optimisation_params:
          objective:
              - polarity: minimise
                target: soc_proxy_ldes
                weight: 1.0
                mode: match
  clustering with opt, peak objective term:
      dispatch_mode: 'cluster_with_optimisation'
      calliope_params:
      soc_proxy_params:
      tsa_params:
        k_periods: 146
        k_periods_optimisation: 37
        resample_to_daily_resolution: True
        distance_matrix_metric: 'euclidean'
        soc_proxy: 
            use_soc_proxy: True
            proxy_inputs_to_consider: ['surplus_LDES'] 
            proxy_window: None
            optimisation_proxy_mode: 'endogenous'
            lambda_soc: 0.5
        # apply_endogenous_biases: True
        timelimit: 600
        matrix_weights: 
              renewables: 1
              demand: 1
              proxy: 100
        cluster_method: k_means
        soc_features:
          soc_discharge_MWh: 1
          soc_charge_MWh: 1
        extremes_spec: {}
        soft_prune: False
        with_peak_max_obj_function: True
        post_cluster_optimisation_params:
          objective:
              - polarity: minimise
                target: soc_proxy_ldes
                weight: 1.0
                mode: match
